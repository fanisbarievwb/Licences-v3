<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Проверка прав сотрудника</title>
    <style>
        :root {
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-main: #212529;
            --text-muted: #6c757d;
            --accent: #4f46e5;
            --accent-hover: #4338ca;
            --border: #e5e7eb;
            --success: #10b981;
            --warning: #f59e0b;
            --error: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 400px;
            border: 1px solid var(--border);
        }

        h1 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 8px;
            text-align: center;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 14px;
            text-align: center;
            margin-bottom: 32px;
        }

        .form-group {
            margin-bottom: 24px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.2s ease;
            outline: none;
        }

        input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: var(--accent);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        button:disabled {
            background-color: var(--text-muted);
            cursor: not-allowed;
            opacity: 0.6;
        }

        .result {
            margin-top: 28px;
            padding: 16px;
            border-radius: 8px;
            font-size: 15px;
            display: none;
            text-align: center;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .status-active { background-color: #ecfdf5; color: var(--success); border: 1px solid #a7f3d0; }
        .status-limited { background-color: #fffbeb; color: var(--warning); border: 1px solid #fde68a; }
        .status-error { background-color: #fef2f2; color: var(--error); border: 1px solid #fecaca; }
    </style>
</head>
<body>

    <div class="card">
        <h1>Доступ сотрудника</h1>
        <p class="subtitle">База данных Google Sheets</p>
        
        <div class="form-group">
            <label for="employeeId">Идентификатор сотрудника</label>
            <input type="text" id="employeeId" placeholder="Введите ID..." autocomplete="off">
        </div>
        
        <button id="submitBtn" onclick="checkPermissions()">Проверить статус</button>
        
        <div id="resultBox" class="result"></div>
    </div>

    <script>
        // ВСТАВЬТЕ СЮДА ВАШ URL ИЗ GOOGLE APPS SCRIPT
        const API_URL = 'ПЕРЕНЕСИТЕ_СЮДА_ВАШУ_ССЫЛКУ_ИЗ_ШАГА_1';

        async function checkPermissions() {
            const idInput = document.getElementById('employeeId').value.trim();
            const resultBox = document.getElementById('resultBox');
            const submitBtn = document.getElementById('submitBtn');
            
            resultBox.className = 'result';
            resultBox.style.display = 'block';

            if (!idInput) {
                resultBox.classList.add('status-error');
                resultBox.innerHTML = 'Пожалуйста, введите ID сотрудника.';
                return;
            }

            // Индикация загрузки данных
            submitBtn.disabled = true;
            submitBtn.innerText = 'Поиск...';
            resultBox.style.display = 'none';

            try {
                // Запрос к API Google Таблицы
                const response = await fetch(`${API_URL}?id=${encodeURIComponent(idInput)}`);
                const result = await response.json();

                resultBox.style.display = 'block';

                if (result.success) {
                    const employee = result.data;
                    // Подставляем класс цвета на основе поля type (active/limited/error)
                    const statusClass = employee.type ? `status-${employee.type}` : 'status-limited';
                    
                    resultBox.classList.add(statusClass);
                    resultBox.innerHTML = `<strong>${employee.name || 'Без имени'}</strong><br>${employee.status || 'Статус не указан'}`;
                } else {
                    resultBox.classList.add('status-error');
                    resultBox.innerHTML = `Сотрудник с ID <strong>${idInput}</strong> не найден.`;
                }
            } catch (error) {
                resultBox.style.display = 'block';
                resultBox.classList.add('status-error');
                resultBox.innerHTML = 'Ошибка сети. Не удалось связаться с базой данных.';
                console.error(error);
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = 'Проверить статус';
            }
        }

        document.getElementById('employeeId').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                checkPermissions();
            }
        });
    </script>

</body>
</html>
