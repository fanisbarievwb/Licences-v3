<!DOCTYPE html>
<html lang="ru">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Проверка прав сотрудника</title>
    <style>
        body { font-family: sans-serif; text-align: center; margin-top: 50px; }
        input { padding: 10px; font-size: 16px; width: 200px; }
        button { padding: 10px 15px; font-size: 16px; cursor: pointer; }
        #result { margin-top: 20px; font-size: 18px; font-weight: bold; }

</head>
<body>
                    <style>
        :root {
            --primary-color: #4F46E5;
            --primary-hover: #4338CA;
            --bg-color: #F3F4F6;
            --card-bg: #FFFFFF;
            --text-main: #111827;
            --text-muted: #6B7280;
            --border-color: #E5E7EB;
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background: var(--card-bg);
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        h2 { 
            margin-top: 0;
            margin-bottom: 0.5rem;
            font-size: 1.5rem;
            font-weight: 600;
        }

        p {
            color: var(--text-muted);
            margin-bottom: 2rem;
            font-size: 0.95rem;
        }

        .input-group {
            display: flex;
            gap: 0.5rem;
            justify-content: center;
        }

        input { 
            padding: 0.75rem 1rem; 
            font-size: 1rem; 
            width: 100%;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            box-sizing: border-box;
        }

        input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        button { 
            padding: 0.75rem 1.5rem; 
            font-size: 1rem; 
            font-weight: 500;
            color: white;
            background-color: var(--primary-color);
            border: none;
            border-radius: 6px;
            cursor: pointer; 
            transition: background-color 0.2s;
            white-space: nowrap;
        }

        button:hover { 
            background-color: var(--primary-hover); 
        }
        
        #result { 
            margin-top: 2rem; 
            padding: 1rem;
            border-radius: 6px;
            font-size: 1rem; 
            font-weight: 500;
            display: none; /* Скрыт по умолчанию */
            background-color: #F9FAFB;
            border: 1px solid var(--border-color);
        }

        /* Стили для вывода разных статусов */
        #result.success {
            color: #065F46;
            background-color: #ECFDF5;
            border-color: #A7F3D0;
        }

        #result.error {
            color: #991B1B;
            background-color: #FEF2F2;
            border-color: #FCA5A5;
        }
    </style>
    <h2>Проверка прав по ID</h2>
    <input type="text" id="employeeId" placeholder="Введите ID сотрудника">
    <button onclick="checkStatus()">Проверить</button>
    
    <div id="result"></div>

    <script src="script.js"></script>
            
                </style>
</body>
</html>
