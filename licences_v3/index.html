<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Проверка прав сотрудника</title>
    <style>
        :root {
            --primary-color: #4F46E5;
            --primary-hover: #4338CA;
            --bg-color: #F3F4F6;
            --card-bg: #FFFFFF;
            --text-main: #111827;
            --text-muted: #6B7280;
            --border-color: #E5E7EB;
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background: var(--card-bg);
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        h2 { 
            margin-top: 0;
            margin-bottom: 0.5rem;
            font-size: 1.5rem;
            font-weight: 600;
        }

        p {
            color: var(--text-muted);
            margin-bottom: 2rem;
            font-size: 0.95rem;
        }

        .input-group {
            display: flex;
            gap: 0.5rem;
            justify-content: center;
        }

        input { 
            padding: 0.75rem 1rem; 
            font-size: 1rem; 
            width: 100%;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            outline: none;
            box-sizing: border-box;
        }

        input:focus {
            border-color: var(--primary-color);
        }

        button { 
            padding: 0.75rem 1.5rem; 
            font-size: 1rem; 
            font-weight: 500;
            color: white;
            background-color: var(--primary-color);
            border: none;
            border-radius: 6px;
            cursor: pointer; 
            white-space: nowrap;
        }

        button:hover { 
            background-color: var(--primary-hover); 
        }
        
        #result { 
            margin-top: 2rem; 
            padding: 1rem;
            border-radius: 6px;
            font-size: 1rem; 
            font-weight: 500;
            display: none; /* Скрыт до нажатия кнопки */
            border: 1px solid var(--border-color);
        }

        /* Стили для разных статусов (добавляются через JS) */
        #result.success {
            color: #065F46;
            background-color: #ECFDF5;
            border-color: #A7F3D0;
            display: block; /* Показываем при успешном классе */
        }

        #result.error {
            color: #991B1B;
            background-color: #FEF2F2;
            border-color: #FCA5A5;
            display: block; /* Показываем при классе ошибки */
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Проверка прав</h2>
        <p>Введите ID сотрудника для получения информации о его доступе.</p>
        
        <div class="input-group">
            <input type="text" id="employeeId" placeholder="ID сотрудника">
            <button onclick="checkStatus()">Проверить</button>
        </div>
        
        <div id="result"></div>
    </div>

    <script>
        // Логика проверки прав
        function checkStatus() {
            const resultDiv = document.getElementById('result');
            const inputVal = document.getElementById('employeeId').value.trim();
            
            // Если поле пустое, ничего не делаем
            if (!inputVal) {
                resultDiv.textContent = 'Пожалуйста, введите ID.';
                resultDiv.className = 'error';
                return;
            }

            // Имитация проверки (замените на вашу логику или запрос к API)
            if (inputVal === '1' || inputVal === '100') {
                resultDiv.textContent = 'Статус: Полный доступ (Администратор)';
                resultDiv.className = 'success';
            } else {
                resultDiv.textContent = 'Статус: Доступ ограничен (Обычный пользователь)';
                resultDiv.className = 'success';
            }
        }
    </script>
</body>
</html>
