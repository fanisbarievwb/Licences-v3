<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Проверка прав сотрудника</title>
    <style>
        :root {
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-main: #212529;
            --text-muted: #6c757d;
            --accent: #4f46e5;
            --accent-hover: #4338ca;
            --border: #e5e7eb;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 420px;
            transition: all 0.3s ease;
        }

        h1 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 8px;
            text-align: center;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 14px;
            text-align: center;
            margin-bottom: 32px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 8px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input[type="text"] {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: var(--accent);
        }

        button {
            width: 100%;
            padding: 14px;
            background-color: var(--accent);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        .result-box {
            margin-top: 28px;
            padding: 16px;
            border-radius: 8px;
            border: 1px solid var(--border);
            display: none;
            opacity: 0;
            transform: translateY(-10px);
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        .result-box.show {
            display: block;
            opacity: 1;
            transform: translateY(0);
        }

        .result-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .result-row:last-child {
            margin-bottom: 0;
        }

        .label {
            color: var(--text-muted);
        }

        .value {
            font-weight: 500;
        }

        .status-badge {
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .status-active { background: #e6f4ea; color: var(--success); }
        .status-restricted { background: #fff7ed; color: var(--warning); }
        .status-blocked { background: #fef2f2; color: var(--danger); }
    </style>
</head>
<body>

    <div class="container">
        <h1>Доступ к системе</h1>
        <p class="subtitle">Введите ID для проверки уровня прав</p>

        <form id="checkForm" onsubmit="checkPermissions(event)">
            <div class="form-group">
                <label for="employeeId">ID Сотрудника</label>
                <input type="text" id="employeeId" placeholder="Например: EMP-402" required autocomplete="off">
            </div>
            <button type="submit">Проверить статус</button>
        </form>

        <div id="resultBox" class="result-box">
            <div class="result-row">
                <span class="label">ФИО:</span>
                <span id="resName" class="value">—</span>
            </div>
            <div class="result-row">
                <span class="label">Роль:</span>
                <span id="resRole" class="value">—</span>
            </div>
            <div class="result-row">
                <span class="label">Статус прав:</span>
                <span id="resStatus" class="status-badge">—</span>
            </div>
        </div>
    </div>

    <script>
        // Демо-данные для симуляции базы данных
        const mockDatabase = {
            "101": { name: "Алексей Иванов", role: "Администратор", status: "active", statusText: "Полный доступ" },
            "102": { name: "Мария Сидорова", role: "Менеджер", status: "restricted", statusText: "Ограничен" },
            "103": { name: "Иван Петров", role: "Разработчик", status: "blocked", statusText: "Заблокирован" }
        };

        function checkPermissions(event) {
            event.preventDefault();
            
            const idInput = document.getElementById('employeeId').value.trim();
            const resultBox = document.getElementById('resultBox');
            
            // Элементы вывода
            const resName = document.getElementById('resName');
            const resRole = document.getElementById('resRole');
            const resStatus = document.getElementById('resStatus');

            // Скрываем блок перед новым поиском для красивой анимации
            resultBox.classList.remove('show');

            setTimeout(() => {
                if (mockDatabase[idInput]) {
                    const employee = mockDatabase[idInput];
                    
                    resName.textContent = employee.name;
                    resRole.textContent = employee.role;
                    resStatus.textContent = employee.statusText;
                    
                    // Сброс классов статуса
                    resStatus.className = 'status-badge';
                    // Добавление нужного цвета
                    resStatus.classList.add(`status-${employee.status}`);
                } else {
                    // Если сотрудник не найден
                    resName.textContent = "Не найден";
                    resRole.textContent = "—";
                    resStatus.textContent = "Нет доступа";
                    resStatus.className = 'status-badge status-blocked';
                }

                // Показываем блок с результатом
                resultBox.classList.add('show');
            }, 200); 
        }
    </script>

</body>
</html>
