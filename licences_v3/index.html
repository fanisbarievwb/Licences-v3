<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Проверка прав сотрудника</title>
    <style>
        :root {
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-main: #212529;
            --text-muted: #6c757d;
            --accent: #4f46e5;
            --accent-hover: #4338ca;
            --border: #e5e7eb;
            --success: #10b981;
            --warning: #f59e0b;
            --error: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            width: 100%;
            max-width: 400px;
            border: 1px solid var(--border);
        }

        h1 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 8px;
            text-align: center;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 14px;
            text-align: center;
            margin-bottom: 32px;
        }

        .form-group {
            margin-bottom: 24px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 8px;
            color: var(--text-main);
        }

        input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.2s ease;
            outline: none;
        }

        input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: var(--accent);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        .result {
            margin-top: 28px;
            padding: 16px;
            border-radius: 8px;
            font-size: 15px;
            display: none;
            text-align: center;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .status-active {
            background-color: #ecfdf5;
            color: var(--success);
            border: 1px solid #a7f3d0;
        }

        .status-limited {
            background-color: #fffbeb;
            color: var(--warning);
            border: 1px solid #fde68a;
        }

        .status-error {
            background-color: #fef2f2;
            color: var(--error);
            border: 1px solid #fecaca;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Доступ сотрудника</h1>
        <p class="subtitle">Введите ID для проверки уровня прав</p>
        
        <div class="form-group">
            <label for="employeeId">Идентификатор сотрудника</label>
            <input type="text" id="employeeId" placeholder="Например: 101" autocomplete="off">
        </div>
        
        <button onclick="checkPermissions()">Проверить статус</button>
        
        <div id="resultBox" class="result"></div>
    </div>

    <script>
        function checkPermissions() {
            const idInput = document.getElementById('employeeId').value.trim();
            const resultBox = document.getElementById('resultBox');
            
            // Сброс стиля перед новой проверкой
            resultBox.className = 'result';
            resultBox.style.display = 'block';

            if (!idInput) {
                resultBox.classList.add('status-error');
                resultBox.innerHTML = 'Пожалуйста, введите ID сотрудника.';
                return;
            }

            // Имитация базы данных (демо-данные)
            const mockDatabase = {
                "101": { name: "Алексей Иванов", status: "Полный доступ (Администратор)", type: "active" },
                "102": { name: "Мария Сидорова", status: "Ограниченный доступ (Менеджер)", type: "limited" },
                "103": { name: "Иван Петров", status: "Доступ заблокирован", type: "error" }
            };

            const employee = mockDatabase[idInput];

            if (employee) {
                resultBox.classList.add('status-' + employee.type);
                resultBox.innerHTML = `<strong>${employee.name}</strong><br>${employee.status}`;
            } else {
                resultBox.classList.add('status-error');
                resultBox.innerHTML = `Сотрудник с ID <strong>${idInput}</strong> не найден.`;
            }
        }

        // Позволяет отправлять форму по нажатию Enter
        document.getElementById('employeeId').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                checkPermissions();
            }
        });
    </script>

</body>
</html>
